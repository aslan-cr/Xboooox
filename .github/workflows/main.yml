name: Build Xbox MSIX

on:
  workflow_dispatch:
  push:
    branches: [ main, ana ]

env:
  PUBLISHER: "CN=AslanDev"
  PFX_PASS: "DevPass123!"

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Windows Kits\10\bin"
          $make = Get-ChildItem $root -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $sign = Get-ChildItem $root -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $make -or -not $sign) { throw "makeappx veya signtool bulunamadi." }
          "MAKEAPPX=$make" >> $env:GITHUB_OUTPUT
          "SIGNTOOL=$sign" >> $env:GITHUB_OUTPUT

      - name: Stage package (Xbox only)
        shell: pwsh
        run: |
          $src = Join-Path $PWD "gozkirpma-xbox"
          $pkg = Join-Path $env:RUNNER_TEMP "XboxPkg"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          # server/ (Node), *.orig ve README paket disinda kalir
          robocopy $src $pkg /E /XD server /XF *.orig README-XBOX.md | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy basarisiz: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          # Gerekli dosyalar var mi?
          foreach ($f in "AppxManifest.xml","index.html","Assets\StoreLogo.png","Assets\Square150x150Logo.png","Assets\Square44x44Logo.png","Assets\Wide310x150Logo.png","Assets\SplashScreen.png") {
            if (-not (Test-Path (Join-Path $pkg $f))) { throw "Eksik dosya: $f" }
          }
          # Manifest Publisher'i sertifika konusuyla ayni olmali
          [xml]$m = Get-Content (Join-Path $pkg "AppxManifest.xml")
          if ($m.Package.Identity.Publisher -ne $env:PUBLISHER) { throw "Publisher uyusmuyor: $($m.Package.Identity.Publisher)" }

      - name: Pack MSIX (dogrulama acik)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "Out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "${{ steps.sdk.outputs.MAKEAPPX }}" pack /d (Join-Path $env:RUNNER_TEMP "XboxPkg") /p "$out\KaranlikBataklik-Xbox.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx basarisiz" }

      - name: Create certificate and sign
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "Out"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER `
            -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -FriendlyName "KaranlikBataklik Xbox Dev" -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(3) `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString $env:PFX_PASS -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$out\dev-cert.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$out\KaranlikBataklik-Xbox.cer" | Out-Null
          & "${{ steps.sdk.outputs.SIGNTOOL }}" sign /fd SHA256 /f "$out\dev-cert.pfx" /p $env:PFX_PASS "$out\KaranlikBataklik-Xbox.msix"
          if ($LASTEXITCODE -ne 0) { throw "signtool basarisiz" }
          Remove-Item "$out\dev-cert.pfx"

      - name: Upload MSIX and certificate
        uses: actions/upload-artifact@v4
        with:
          name: KaranlikBataklik-Xbox-MSIX
          path: |
            ${{ runner.temp }}\Out\KaranlikBataklik-Xbox.msix
            ${{ runner.temp }}\Out\KaranlikBataklik-Xbox.cer

name: Build Xbox MSIX

on:
  workflow_dispatch:
  push:
    branches: [ main, ana ]

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Windows SDK makeappx.exe
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem -Path $sdkRoot -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.FullName -like "*\x64\makeappx.exe" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe bulunamadi." }
          echo "MAKEAPPX=$makeappx" >> $env:GITHUB_OUTPUT

      - name: Prepare UWP Web Package
        shell: pwsh
        run: |
          $pkgDir = "$env:RUNNER_TEMP\XboxPkg"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null

          $srcDir = Join-Path (Get-Location).Path "gozkirpma-xbox"
          if (-not (Test-Path $srcDir)) {
            $srcDir = (Get-Location).Path
          }

          Copy-Item -Path "$srcDir\*" -Destination $pkgDir -Recurse -Force

          $img = Get-ChildItem -Path $pkgDir -Include "*.jpg","*.jpeg","*.png" -Recurse | Select-Object -First 1
          if ($img) {
            Copy-Item -Path $img.FullName -Destination "$pkgDir\app-logo.jpg" -Force
          } else {
            $b64 = "/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA="
            [IO.File]::WriteAllBytes("$pkgDir\app-logo.jpg", [Convert]::FromBase64String($b64))
          }

          $manifestLines = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" IgnorableNamespaces="uap">'
            '  <Identity Name="GozKirpma.KaranlikBataklik.Xbox" Publisher="CN=AslanDev" Version="1.0.0.0" ProcessorArchitecture="x64" />'
            '  <Properties>'
            '    <DisplayName>Karanlik Bataklik</DisplayName>'
            '    <PublisherDisplayName>AslanDev</PublisherDisplayName>'
            '    <Logo>app-logo.jpg</Logo>'
            '  </Properties>'
            '  <Dependencies>'
            '    <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />'
            '  </Dependencies>'
            '  <Capabilities>'
            '    <Capability Name="internetClient" />'
            '  </Capabilities>'
            '  <Applications>'
            '    <Application Id="App" StartPage="index.html">'
            '      <uap:VisualElements DisplayName="Karanlik Bataklik" Description="Karanlik Bataklik Xbox Surumu" BackgroundColor="#111111" Square150x150Logo="app-logo.jpg" Square44x44Logo="app-logo.jpg">'
            '        <uap:DefaultTile ShortName="Bataklik" />'
            '      </uap:VisualElements>'
            '    </Application>'
            '  </Applications>'
            '</Package>'
          )
          $manifestLines -join "`r`n" | Set-Content -Path "$pkgDir\AppxManifest.xml" -Encoding UTF8

      - name: Pack MSIX
        shell: pwsh
        run: |
          $pkgDir = "$env:RUNNER_TEMP\XboxPkg"
          $outDir = "$env:RUNNER_TEMP\Out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & "${{ steps.sdk.outputs.MAKEAPPX }}" pack /d "$pkgDir" /p "$outDir\KaranlikBataklik-Xbox.msix" /nv

      - name: Sign MSIX package
        shell: pwsh
        run: |
          $msixPath = "$env:RUNNER_TEMP\Out\KaranlikBataklik-Xbox.msix"

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=AslanDev" `
            -FriendlyName "AslanDev Xbox Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My"

          $pwd = ConvertTo-SecureString -String "DevPass123!" -Force -AsPlainText
          $pfxPath = "$env:RUNNER_TEMP\dev-cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { throw "signtool.exe bulunamadi." }

          & "$signtool" sign /fd SHA256 /f $pfxPath /p "DevPass123!" "$msixPath"

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaranlikBataklik-Xbox-MSIX
          path: ${{ runner.temp }}\Out\KaranlikBataklik-Xbox.msix
          
